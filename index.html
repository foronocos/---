<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Чики: Перо Затмения</title>
    <meta
      name="description"
      content="Сюжетная 2D-игра о жёлтом попугае корелле Чики: три главы, ожившая квартира, три босса и шесть концовок."
    />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <main id="app">
      <canvas id="game" width="1280" height="720" aria-label="Игра «Чики: Перо Затмения»"></canvas>
      <p id="rotate-hint" aria-hidden="true">Поверни телефон горизонтально — так удобнее</p>
      <p id="fallback" class="fallback" hidden>
        Для игры нужен современный браузер с поддержкой HTML5 Canvas.
      </p>
    </main>
    <script type="module" src="src/main.js"></script>

</html>
